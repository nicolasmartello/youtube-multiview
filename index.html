<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Multiview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="grid">
    <section class="slot" data-slot="0"><div class="player" id="player-0"></div><div class="shield"></div><span class="badge">1</span></section>
    <section class="slot" data-slot="1"><div class="player" id="player-1"></div><div class="shield"></div><span class="badge">2</span></section>
    <section class="slot" data-slot="2"><div class="player" id="player-2"></div><div class="shield"></div><span class="badge">3</span></section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
